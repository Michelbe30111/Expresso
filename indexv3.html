<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Analyseur Expresso ECAM v4.1</title>
<style>
*{box-sizing:border-box} body{font-family:Segoe UI,Arial,sans-serif;background:#1a1a1a;color:#eee;padding:16px;margin:0} .card{background:#252525;border-radius:14px;padding:16px;margin-bottom:14px} h2{color:#c8a97e} button{padding:12px;border:none;border-radius:10px;background:#333;color:#eee;cursor:pointer} #btnRec{width:100%;background:#c0392b;font-size:1.1rem;font-weight:bold} .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px} .btn{flex:1;min-width:120px} table{width:100%;border-collapse:collapse;font-size:.9rem} th,td{border-bottom:1px solid #444;padding:6px;text-align:left} th{color:#c8a97e} .small{font-size:.8rem;color:#aaa} textarea{width:100%;background:#111;color:#eee;border:1px solid #444;border-radius:8px;padding:8px} tr.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>☕ Analyseur Expresso ECAM V3</h2>
<button id="btnRec" onclick="toggleRec()">⏺ Démarrer l'enregistrement</button>
<div class="actions">
<button class="btn" onclick="filePick.click()">📂 Choisir audio</button>
<button class="btn" onclick="toggleHistory()">🕘 Historique</button>
<button class="btn" onclick="clearHistory()">🗑 Vider</button>
<input id="filePick" type="file" accept="audio/*,.m4a,.mp3,.wav" style="display:none">
</div>
<div id="status">Prêt</div>
</div>
<div class="card" id="resultCard" style="display:none">
<h2>Résultat</h2>
<table><thead><tr><th>Phase</th><th>Début</th><th>Fin</th><th>Durée</th></tr></thead><tbody id="rows"></tbody></table>
<div class="small" id="totalBox"></div>
<textarea id="commentaire" rows="2" placeholder="Commentaire"></textarea>
<div class="actions"><button class="btn" onclick="copyExcel()">📋 Copier Excel</button><button class="btn" onclick="exportCSV()">⬇ CSV</button></div>
</div>
<div class="card" id="lastCard"><h2>10 dernières mesures</h2><div id="avgBox" class="small"></div><table><thead><tr><th>Date</th><th>B</th><th>C</th><th>P</th><th>E</th><th>J</th><th>T</th></tr></thead><tbody id="lastRows"></tbody></table></div>
<div class="card" id="histCard" style="display:none"><h2>Historique détaillé</h2><div id="histRows"></div></div>
<script>
let mediaRecorder=null,audioChunks=[],recording=false,stream=null,current=[],currentFile='enregistrement';
const statusEl=document.getElementById('status');
function fr(n){return Number(n).toFixed(1).replace('.',',');}
function setStatus(t){statusEl.textContent=t;}
function total(){return current.reduce((a,b)=>a+b.dur,0)}
function getMime(){for(const m of ['audio/webm;codecs=opus','audio/webm','']) if(!m||MediaRecorder.isTypeSupported(m)) return m; return '';}
async function toggleRec(){recording?stopRec():await startRec();}
async function startRec(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){setStatus('Micro refusé');return;} audioChunks=[]; mediaRecorder=new MediaRecorder(stream,getMime()?{mimeType:getMime()}:undefined); mediaRecorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)}; mediaRecorder.onstop=()=>analyseBlob(new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'})); mediaRecorder.start(200); recording=true; btnRec.textContent='⏹ Arrêter'; setStatus('Enregistrement...');}
function stopRec(){if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop(); if(stream)stream.getTracks().forEach(t=>t.stop()); recording=false; btnRec.textContent='⏺ Démarrer'; setStatus('Analyse...');}
filePick.onchange=()=>{if(filePick.files[0]){currentFile=filePick.files[0].name; analyseBlob(filePick.files[0]);}};
async function analyseBlob(blob){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(); const decoded=await ctx.decodeAudioData(await blob.arrayBuffer()); const data=decoded.getChannelData(0), sr=decoded.sampleRate, win=Math.floor(sr*0.1); let rms=[]; for(let i=0;i<data.length;i+=win){let s=0,c=0; for(let j=i;j<i+win&&j<data.length;j++){s+=data[j]*data[j];c++;} rms.push(c?Math.sqrt(s/c):0);} const max=Math.max(...rms)||1; const norm=rms.map(v=>v/max); let raw=[],active=false,start=0; for(let i=0;i<norm.length;i++){ if(!active&&norm[i]>0.045){active=true;start=i*0.1;} if(active&&norm[i]<=0.06){raw.push({start:start,end:i*0.1});active=false;}} let blocks=raw.slice(0,5); if(blocks.length<5&&blocks.length){const cs=blocks[0].start, ce=blocks[blocks.length-1].end,total=ce-cs,rat=[0.2,0.13,0.06,0.46,0.15]; let p=cs; blocks=rat.map(r=>{let b={start:p,end:p+total*r};p=b.end;return b;});} const names=['Broyage','Compactage','Pré-extraction','Extraction','Éjection']; current=blocks.map((b,i)=>({phase:names[i],start:b.start,end:b.end,dur:b.end-b.start})); saveHistory(); render(); refreshHistory(); refreshLast(); setStatus('Analyse OK');}catch(e){setStatus('Erreur analyse');}}
function render(){rows.innerHTML=''; current.forEach(r=>rows.innerHTML+=`<tr><td>${r.phase}</td><td>${fr(r.start)}</td><td>${fr(r.end)}</td><td>${fr(r.dur)}</td></tr>`); totalBox.textContent='Total : '+fr(total())+' s'; resultCard.style.display='block';}
function getHist(){return JSON.parse(localStorage.getItem('expressoHistV4')||'[]');}
function saveHist(h){localStorage.setItem('expressoHistV4',JSON.stringify(h));}
function saveHistory(){let h=getHist(); h.unshift({date:new Date().toLocaleString('fr-FR'),file:currentFile,comment:commentaire.value||'',data:current}); saveHist(h.slice(0,50));}
function refreshHistory(){let h=getHist(); histRows.innerHTML=h.map((x,i)=>`<div style='border-bottom:1px solid #444;padding:8px'><b>${x.date}</b> ${x.file}<br>${x.data.map(d=>d.phase[0]+':'+fr(d.dur)).join(' ')} <button onclick='loadHist(${i})'>Charger</button> <button onclick='delHist(${i})'>Suppr</button></div>`).join('');}
function refreshLast(){let h=getHist().slice(0,10); lastRows.innerHTML=h.map((x,i)=>{let d=x.data; let t=d.reduce((a,b)=>a+b.dur,0); return `<tr class='clickable' onclick='loadHist(${i})'><td>${x.date.split(' ')[0]}</td><td>${fr(d[0]?.dur||0)}</td><td>${fr(d[1]?.dur||0)}</td><td>${fr(d[2]?.dur||0)}</td><td>${fr(d[3]?.dur||0)}</td><td>${fr(d[4]?.dur||0)}</td><td>${fr(t)}</td></tr>`}).join(''); if(h.length){let sums=[0,0,0,0,0]; h.forEach(x=>x.data.forEach((d,i)=>sums[i]+=d.dur)); avgBox.textContent='Moyenne : '+sums.map(v=>fr(v/h.length)).join(' / ');} }
function loadHist(i){let x=getHist()[i]; if(!x)return; current=x.data; commentaire.value=x.comment||''; currentFile=x.file; render();}
function delHist(i){let h=getHist(); h.splice(i,1); saveHist(h); refreshHistory(); refreshLast();}
function clearHistory(){if(confirm('Vider historique ?')){saveHist([]); refreshHistory(); refreshLast();}}
function toggleHistory(){histCard.style.display=histCard.style.display==='none'?'block':'none'; refreshHistory();}
function copyExcel(){if(!current.length)return; let txt='Fichier\tCommentaire\tBroyage\tCompactage\tPré-extraction\tExtraction\tÉjection\tTotal\n'+currentFile+'\t'+(commentaire.value||'')+'\t'+current.map(r=>fr(r.dur)).join('\t')+'\t'+fr(total()); navigator.clipboard?.writeText(txt);}
function exportCSV(){if(!current.length)return; let csv='Phase;Début;Fin;Durée\n'+current.map(r=>`${r.phase};${fr(r.start)};${fr(r.end)};${fr(r.dur)}`).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv'})); a.download='analyse_expresso.csv'; a.click();}
refreshLast();
</script></body></html>
